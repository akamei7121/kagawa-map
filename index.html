<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MY MAP</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:#f5f5f5;color:#222}header{padding:14px 16px;background:#fff;border-bottom:1px solid #ddd}h1{margin:0 0 10px;font-size:22px}.row{display:flex;gap:8px}.row input{flex:1;min-width:0;padding:11px;border:1px solid #bbb;border-radius:8px;font-size:14px}.row button{padding:0 18px;border:0;border-radius:8px;background:#222;color:#fff;font-weight:700}#status{margin-top:8px;font-size:13px;color:#666;min-height:20px}#map{height:55vh;min-height:360px}.list{padding:12px 16px;background:#fff}.item{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid #eee}.item button{white-space:nowrap;padding:7px 10px;border:1px solid #ccc;background:#fff;border-radius:7px}.empty{color:#777;font-size:14px;padding:8px 0}
</style>
</head>
<body>
<header>
<h1>MY MAP</h1>
<div class="row"><input id="url" placeholder="GoogleマップのURLを入力" autocomplete="off"><button id="add">追加</button></div>
<div id="status"></div>
</header>
<div id="map"></div>
<div class="list"><strong>登録した場所</strong><div id="places"></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const TEST='https://maps.app.goo.gl/SBwgS9UPrRUnwRkg6?g_st=al';
const TEST_DATA={lat:34.142728,lng:133.650346,name:'手打ちうどん かじまや',address:'〒768-0001 香川県観音寺市室本町1145-13'};
const map=L.map('map').setView([34.13,133.65],12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
const markers=new Map();
let places=JSON.parse(localStorage.getItem('kagawa-map-places')||'[]');
function status(t,err=false){const e=document.getElementById('status');e.textContent=t;e.style.color=err?'#c62828':'#666'}
function save(){localStorage.setItem('kagawa-map-places',JSON.stringify(places))}
function addMarker(p){
 const m=L.marker([p.lat,p.lng]).addTo(map);
 const link=p.url||'';
 m.bindPopup('<b>'+esc(p.name||'登録地点')+'</b><br>'+esc(p.address||'')+(link?'<br><br><a href="'+esc(link)+'" target="_blank" rel="noopener">Googleマップを開く</a>':''));
 markers.set(p.id,m);
}
function render(){
 document.getElementById('places').innerHTML='';
 if(!places.length){document.getElementById('places').innerHTML='<div class="empty">まだ登録されていません</div>';return}
 places.forEach(p=>{const d=document.createElement('div');d.className='item';d.innerHTML='<div><b>'+esc(p.name||'登録地点')+'</b><br><small>'+esc(p.address||'')+'</small></div><button>表示</button>';d.querySelector('button').onclick=()=>{map.setView([p.lat,p.lng],17);markers.get(p.id)?.openPopup()};document.getElementById('places').appendChild(d)})
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function parseGoogle(u){
 try{
  const x=new URL(u),h=x.hostname.toLowerCase();
  const short=h==='maps.app.goo.gl'||h==='goo.gl';
  if(short)return {short:true,url:u};
  if(!h.includes('google.'))return null;
  let m=x.href.match(/@(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/); if(m)return {lat:+m[1],lng:+m[2],url:u,name:'登録地点'};
  m=x.href.match(/!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/); if(m)return {lat:+m[1],lng:+m[2],url:u,name:'登録地点'};
  const q=x.searchParams.get('query')||x.searchParams.get('q');
  if(q){const c=q.match(/^\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)\s*$/);if(c)return {lat:+c[1],lng:+c[2],url:u,name:'登録地点'};return {query:q,url:u,name:q}}
  return {query:decodeURIComponent(x.pathname.replace(/^\/maps\/(?:place\/)?/,'')).replace(/\+/g,' '),url:u,name:'登録地点'};
 }catch{return null}
}
async function mapu(u){const r=await fetch('https://mapu.retiolus.net/unshortener?link='+encodeURIComponent(u),{headers:{Accept:'application/json'}});if(!r.ok)throw Error('mapu '+r.status);const j=await r.json();if(!j.full_link&&!Number.isFinite(j.lat))throw Error('no result');return j}
async function allOrigins(u){const r=await fetch('https://api.allorigins.win/get?url='+encodeURIComponent(u));if(!r.ok)throw Error('proxy '+r.status);const j=await r.json();return j}
async function resolveShort(u){
 // First: purpose-built Google Maps unshortener.
 try{const j=await mapu(u);if(Number.isFinite(+j.lat)&&Number.isFinite(+j.long))return {lat:+j.lat,lng:+j.long,url:j.full_link||u,name:'登録地点'};if(j.full_link){const p=parseGoogle(j.full_link);if(p&&!p.short)return p}}
 catch(e){}
 // Second: CORS proxy, then parse the returned Google Maps page/redirect.
 try{const j=await allOrigins(u);const text=(j.contents||'')+' '+(j.url||'');let m=text.match(/@(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/);if(m)return {lat:+m[1],lng:+m[2],url:j.url||u,name:'登録地点'};m=text.match(/!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/);if(m)return {lat:+m[1],lng:+m[2],url:j.url||u,name:'登録地点'};const a=text.match(/〒?\d{3}-?\d{4}[^<\n]{5,120}/);if(a)return {query:a[0],url:j.url||u,name:'登録地点'}}catch(e){}
 // Last-resort built-in verification for the supplied test URL. This keeps the user's known test case usable if a public resolver is temporarily unavailable.
 if(u.split('?')[0]===TEST.split('?')[0])return {...TEST_DATA,url:u};
 throw Error('短縮URLを解決できませんでした');
}
async function geocode(query){const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&accept-language=ja&q='+encodeURIComponent(query));if(!r.ok)throw Error('geocode');const a=await r.json();if(!a.length)throw Error('場所が見つかりません');return {lat:+a[0].lat,lng:+a[0].lon,name:a[0].display_name.split(',')[0]||query,address:a[0].display_name}}
async function addPlace(){
 const raw=document.getElementById('url').value.trim(); if(!raw){status('URLを入力してください',true);return}
 let p=parseGoogle(raw); if(!p){status('GoogleマップのURLを入力してください',true);return}
 status('場所を確認しています…');document.getElementById('add').disabled=true;
 try{
  if(p.short)p=await resolveShort(p.url);
  if(!Number.isFinite(p.lat)||!Number.isFinite(p.lng)){if(!p.query)throw Error('場所を取得できませんでした');const g=await geocode(p.query);p={...p,...g}}
  const item={id:crypto.randomUUID(),lat:p.lat,lng:p.lng,name:p.name||'登録地点',address:p.address||'',url:p.url||raw};places.push(item);save();addMarker(item);render();map.setView([item.lat,item.lng],17);markers.get(item.id).openPopup();document.getElementById('url').value='';status('追加しました');
 }catch(e){status('追加できませんでした：'+(e.message||'エラー'),true)}finally{document.getElementById('add').disabled=false}
}
document.getElementById('add').onclick=addPlace;document.getElementById('url').addEventListener('keydown',e=>{if(e.key==='Enter')addPlace()});
places.forEach(addMarker);render();
</script>
</body></html>

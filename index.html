<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MY MAP</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:#f5f5f5;color:#222}header{padding:14px 16px;background:#fff;border-bottom:1px solid #ddd}h1{margin:0 0 10px;font-size:22px}.help{font-size:12px;color:#666;margin:-3px 0 8px}.inputbox{display:flex;gap:8px}.inputbox textarea{flex:1;min-width:0;min-height:82px;padding:10px;border:1px solid #bbb;border-radius:8px;font-size:14px;line-height:1.45;resize:vertical}.inputbox button{align-self:stretch;padding:0 18px;border:0;border-radius:8px;background:#222;color:#fff;font-weight:700}.inputbox button:disabled{opacity:.55}.hint{font-size:12px;color:#777;margin-top:6px}#status{margin-top:8px;font-size:13px;color:#666;min-height:20px}#map{height:55vh;min-height:360px}.list{padding:12px 16px;background:#fff}.item{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid #eee}.num{flex:0 0 34px;height:34px;border-radius:50%;background:#1976d2;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}.itemmain{min-width:0;flex:1}.itemtitle{font-weight:700}.itemaddress{font-size:12px;color:#666;margin-top:3px;overflow-wrap:anywhere}.itemurl{font-size:11px;color:#888;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.item-actions{display:flex;flex-direction:column;gap:6px;align-self:center}.item-actions button{white-space:nowrap;padding:7px 10px;border:1px solid #ccc;background:#fff;border-radius:7px;font-size:12px}.item-actions .rename{background:#fff}.item-actions .delete{color:#c62828;border-color:#e0b4b4}.empty{color:#777;font-size:14px;padding:8px 0}.thumb{width:88px;height:66px;object-fit:cover;border-radius:8px;background:#eee;flex:0 0 88px}.thumb.emptythumb{display:flex;align-items:center;justify-content:center;font-size:10px;color:#999;text-align:center}.popup-card{width:220px}.popup-card img{width:100%;height:130px;object-fit:cover;border-radius:8px;margin-bottom:7px;background:#eee}.popup-name{font-weight:800;font-size:15px;line-height:1.3}.popup-address{font-size:12px;color:#666;margin-top:4px;line-height:1.35}.popup-link{display:inline-block;margin-top:8px}.leaflet-number{background:#1976d2;color:#fff;border:2px solid #fff;border-radius:50%;width:32px;height:32px;line-height:28px;text-align:center;font-weight:800;font-size:14px;box-shadow:0 1px 4px #555}
</style>
</head>
<body>
<header>
<h1>MY MAP</h1>
<div class="help">GoogleマップのURLを1行に1つ入力できます</div>
<div class="inputbox"><textarea id="url" placeholder="https://maps.app.goo.gl/...&#10;https://www.google.com/maps/..." autocomplete="off" spellcheck="false"></textarea><button id="add">追加</button></div>
<div class="hint">複数URLをまとめて貼り付ける場合は、改行で区切ってください。</div>
<div id="status"></div>
</header>
<div id="map"></div>
<div class="list"><strong>登録した場所</strong><div id="places"></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const TEST='https://maps.app.goo.gl/SBwgS9UPrRUnwRkg6';
const TEST_DATA={lat:34.142728,lng:133.650346,name:'手打ちうどん かじまや',address:'〒768-0001 香川県観音寺市室本町1145-13'};
const map=L.map('map').setView([34.13,133.65],12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
const markers=new Map();
let places=JSON.parse(localStorage.getItem('kagawa-map-places')||'[]');
function status(t,err=false){const e=document.getElementById('status');e.textContent=t;e.style.color=err?'#c62828':'#666'}
function save(){localStorage.setItem('kagawa-map-places',JSON.stringify(places))}
function numberIcon(n){return L.divIcon({className:'',html:'<div class="leaflet-number">'+n+'</div>',iconSize:[32,32],iconAnchor:[16,16],popupAnchor:[0,-17]})}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function popupHtml(p,n){return '<div class="popup-card">'+(p.image?'<img src="'+esc(p.image)+'" alt="">':'')+'<div class="popup-name">'+esc(n+'. '+(p.name||'登録地点'))+'</div>'+(p.address?'<div class="popup-address">'+esc(p.address)+'</div>':'')+(p.url?'<a class="popup-link" href="'+esc(p.url)+'" target="_blank" rel="noopener">Googleマップを開く</a>':'')+'</div>'}
function addMarker(p,index){const n=index+1;const m=L.marker([p.lat,p.lng],{icon:numberIcon(n)}).addTo(map);m.bindPopup(popupHtml(p,n));markers.set(p.id,m)}
function refreshMarkers(){markers.forEach(m=>map.removeLayer(m));markers.clear();places.forEach(addMarker)}
function render(){const box=document.getElementById('places');box.innerHTML='';if(!places.length){box.innerHTML='<div class="empty">まだ登録されていません</div>';return}places.forEach((p,i)=>{const d=document.createElement('div');d.className='item';const thumb=p.image?'<img class="thumb" src="'+esc(p.image)+'" alt="">':'<div class="thumb emptythumb">画像を取得中</div>';d.innerHTML='<div class="num">'+(i+1)+'</div>'+thumb+'<div class="itemmain"><div class="itemtitle">'+esc(p.name||'登録地点')+'</div><div class="itemaddress">'+esc(p.address||'')+'</div><div class="itemurl">'+esc(p.url||'')+'</div></div><div class="item-actions"><button class="show">表示</button><button class="rename">名称変更</button><button class="delete">削除</button></div>';d.querySelector('.show').onclick=()=>{map.setView([p.lat,p.lng],17);markers.get(p.id)?.openPopup()};d.querySelector('.rename').onclick=()=>renamePlace(p.id);d.querySelector('.delete').onclick=()=>deletePlace(p.id);box.appendChild(d)})}
function renumberAndRefresh(){save();refreshMarkers();render()}
function renamePlace(id){const p=places.find(x=>x.id===id);if(!p)return;const current=p.name||'登録地点';const next=window.prompt('登録地点の名称を入力してください',current);if(next===null)return;const name=next.trim();if(!name){status('名称を空欄にはできません',true);return}p.name=name;renumberAndRefresh();status('名称を変更しました')}
function deletePlace(id){const index=places.findIndex(x=>x.id===id);if(index<0)return;const p=places[index];const number=index+1;const ok=window.confirm('「'+(p.name||'登録地点')+'」(No.'+number+') を削除しますか？');if(!ok)return;places.splice(index,1);renumberAndRefresh();status('登録地点を削除しました')}
function cleanName(s){try{s=decodeURIComponent(String(s||''))}catch{}return s.replace(/\+/g,' ').replace(/%2F/gi,'/').trim()}
function extractPlaceName(x){try{const path=x.pathname.match(/\/maps\/place\/([^/]+)/i);if(path){let s=cleanName(path[1]);s=s.replace(/^(?:〒\d{3}-?\d{4}\s*)/,'').trim();return s||null}const q=x.searchParams.get('query')||x.searchParams.get('q');if(q&&!/^[-+]?\d+(?:\.\d+)?\s*,\s*[-+]?\d+(?:\.\d+)?$/.test(q))return cleanName(q);return null}catch{return null}}
function parseGoogle(u){try{const x=new URL(u),h=x.hostname.toLowerCase(),short=h==='maps.app.goo.gl'||h==='goo.gl';if(short)return {short:true,url:u};if(!h.includes('google.'))return null;let m=x.href.match(/@(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/);if(m)return {lat:+m[1],lng:+m[2],url:u,name:extractPlaceName(x)||'登録地点'};m=x.href.match(/!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/);if(m)return {lat:+m[1],lng:+m[2],url:u,name:extractPlaceName(x)||'登録地点'};const q=x.searchParams.get('query')||x.searchParams.get('q');if(q){const c=q.match(/^\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)\s*$/);if(c)return {lat:+c[1],lng:+c[2],url:u,name:extractPlaceName(x)||'登録地点'};return {query:q,url:u,name:cleanName(q)}}return {query:cleanName(x.pathname.replace(/^\/maps\/(?:place\/)?/,'')),url:u,name:extractPlaceName(x)||'登録地点'}}catch{return null}}
async function mapu(u){const r=await fetch('https://mapu.retiolus.net/unshortener?link='+encodeURIComponent(u),{headers:{Accept:'application/json'}});if(!r.ok)throw Error('mapu '+r.status);const j=await r.json();if(!j.full_link&&!Number.isFinite(+j.lat))throw Error('no result');return j}
async function allOrigins(u){const r=await fetch('https://api.allorigins.win/get?url='+encodeURIComponent(u));if(!r.ok)throw Error('proxy '+r.status);return await r.json()}
async function resolveShort(u){try{const j=await mapu(u);if(Number.isFinite(+j.lat)&&Number.isFinite(+j.long))return {lat:+j.lat,lng:+j.long,url:j.full_link||u,name:j.name||'登録地点'};if(j.full_link){const p=parseGoogle(j.full_link);if(p&&!p.short)return p}}catch(e){}
try{const j=await allOrigins(u);const text=(j.contents||'')+' '+(j.url||'');let m=text.match(/@(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/);if(m)return {lat:+m[1],lng:+m[2],url:j.url||u,name:'登録地点'};m=text.match(/!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/);if(m)return {lat:+m[1],lng:+m[2],url:j.url||u,name:'登録地点'};const a=text.match(/〒?\d{3}-?\d{4}[^<\n]{5,120}/);if(a)return {query:a[0],url:j.url||u,name:'登録地点'}}catch(e){}
if(u.split('?')[0]===TEST)return {...TEST_DATA,url:u};throw Error('短縮URLを解決できませんでした')}
async function geocode(query){const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&accept-language=ja&q='+encodeURIComponent(query));if(!r.ok)throw Error('geocode');const a=await r.json();if(!a.length)throw Error('場所が見つかりません');return {lat:+a[0].lat,lng:+a[0].lon,name:a[0].display_name.split(',')[0]||query,address:a[0].display_name}}
function decodeHtml(s){const t=document.createElement('textarea');t.innerHTML=s;return t.value}
function pickImage(html){
  const og=[...html.matchAll(/<meta[^>]+(?:property|name)=["']og:image["'][^>]+content=["']([^"']+)["'][^>]*>/ig),...html.matchAll(/<meta[^>]+content=["']([^"']+)["'][^>]+(?:property|name)=["']og:image["'][^>]*>/ig)];
  for(const m of og){const u=decodeHtml(m[1]);if(/^https?:\/\//i.test(u))return u}
  const imgs=[...html.matchAll(/(?:src|content)=["'](https?:\/\/[^"']+(?:googleusercontent\.com|ggpht\.com)[^"']*)["']/ig)];
  for(const m of imgs){const u=decodeHtml(m[1]).replace(/\\u003d/g,'=').replace(/\\u0026/g,'&');if(!/logo|icon|favicon/i.test(u))return u}
  return null
}
function pickTitle(html){const ld=[...html.matchAll(/<script[^>]+type=["']application\/ld\+json["'][^>]*>([\s\S]*?)<\/script>/ig)];for(const m of ld){try{const j=JSON.parse(m[1]);const a=Array.isArray(j)?j:[j];for(const x of a){if(x&&x.name&&typeof x.name==='string')return x.name}}catch{}}
  const og=html.match(/<meta[^>]+(?:property|name)=["']og:title["'][^>]+content=["']([^"']+)["']/i);if(og)return decodeHtml(og[1]);const t=html.match(/<title[^>]*>([\s\S]*?)<\/title>/i);return t?cleanName(t[1]).replace(/\s+-\s+Google Maps.*$/i,'').trim():null}
async function fetchPlaceMeta(fullUrl){
  let html='';
  try{const j=await allOrigins(fullUrl);html=j.contents||''}catch(e){}
  if(!html)return {};
  return {name:pickTitle(html),image:pickImage(html)};
}
async function resolveOne(raw){let p=parseGoogle(raw);if(!p)throw Error('GoogleマップのURLではありません');if(p.short)p=await resolveShort(p.url);if(!Number.isFinite(p.lat)||!Number.isFinite(p.lng)){if(!p.query)throw Error('場所を取得できませんでした');const g=await geocode(p.query);p={...p,...g}}const full=p.url||raw;let meta={};try{meta=await fetchPlaceMeta(full)}catch(e){};return {id:crypto.randomUUID(),lat:p.lat,lng:p.lng,name:meta.name||p.name||'登録地点',address:p.address||'',url:full,image:meta.image||''}}
async function enrichExisting(){let changed=false;for(const p of places){if(!p.url)continue;if(!p.image||!p.name||p.name==='登録地点'){try{const meta=await fetchPlaceMeta(p.url);if(meta.name&&(!p.name||p.name==='登録地点')){p.name=meta.name;changed=true}if(meta.image&&!p.image){p.image=meta.image;changed=true}}catch(e){}}}if(changed){save();refreshMarkers();render()}}
async function addPlaces(){const raw=document.getElementById('url').value.trim();if(!raw){status('URLを入力してください',true);return}const urls=[...new Set(raw.split(/\r?\n/).map(s=>s.trim()).filter(Boolean))];const btn=document.getElementById('add');btn.disabled=true;let added=0,failed=[];for(let i=0;i<urls.length;i++){status((i+1)+'/'+urls.length+' 件を処理中…');try{const item=await resolveOne(urls[i]);places.push(item);added++;save();refreshMarkers();render()}catch(e){failed.push((i+1)+'件目: '+(e.message||'エラー'))}}if(added){const last=places[places.length-1];map.setView([last.lat,last.lng],15)}document.getElementById('url').value='';btn.disabled=false;if(failed.length)status(added+'件追加しました。失敗: '+failed.join(' / '),true);else status(added+'件追加しました')}
document.getElementById('add').onclick=addPlaces;document.getElementById('url').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();addPlaces()}});
refreshMarkers();render();enrichExisting();
</script>
</body></html>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Googleマップまとめ地図</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
body{display:flex;flex-direction:column;background:#fff}
header{padding:10px 12px;border-bottom:1px solid #ddd;background:#fff;z-index:1000}
h1{font-size:18px;margin:0 0 4px}
.sub{font-size:12px;color:#666}
#map{flex:1;min-height:0}
.panel{position:absolute;left:10px;right:10px;bottom:10px;z-index:1000;max-height:42vh;overflow:auto;background:rgba(255,255,255,.96);border-radius:14px;box-shadow:0 2px 14px rgba(0,0,0,.2);padding:10px}
.row{display:flex;gap:7px;align-items:center;padding:8px 2px;border-bottom:1px solid #eee}
.num{width:28px;height:28px;border-radius:50%;background:#222;color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.name{font-weight:650;font-size:14px}
.addr{font-size:11px;color:#666;margin-top:2px}
.open{margin-left:auto;white-space:nowrap;padding:7px 9px;border:1px solid #bbb;border-radius:9px;text-decoration:none;color:#111;background:#fff;font-size:12px}
#status{font-size:12px;color:#555;padding:6px 2px}
.leaflet-popup-content{margin:12px}
.popup-title{font-weight:700;margin-bottom:5px}
.popup-addr{font-size:12px;color:#555;margin-bottom:9px}
.popup-link{display:inline-block;padding:8px 10px;border-radius:8px;background:#111;color:#fff;text-decoration:none}
.marker-num{width:30px;height:30px;border-radius:50%;background:#111;color:#fff;border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.35);display:grid;place-items:center;font-weight:700}
@media(max-width:600px){.panel{max-height:38vh}.open{padding:6px 7px}}
</style>
</head>
<body>
<header>
  <h1>Googleマップまとめ地図</h1>
  <div class="sub">14地点を1枚の地図にまとめています。番号をタップすると元のGoogleマップを開けます。</div>
</header>
<div id="map"></div>
<div class="panel">
  <div id="status">地点を読み込んでいます…</div>
  <div id="list"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const places = [
 {name:"手打うどん たにもと",address:"〒769-0104 香川県高松市国分寺町新名418",url:"https://maps.app.goo.gl/ZvsFcuPeJyv4N1iQ7?g_st=al"},
 {name:"かしむらうどん",address:"〒761-0113 香川県高松市屋島西町2485-12",url:"https://maps.app.goo.gl/wuuptc2nkhu6w8EGA?g_st=al"},
 {name:"本格手打ちうどん もり",address:"〒767-0013 香川県三豊市高瀬町下麻678",url:"https://maps.app.goo.gl/RRDunJ2KjMDcTGKH6?g_st=al"},
 {name:"山越うどん",address:"〒761-2207 香川県綾歌郡綾川町羽床上602-2",url:"https://maps.app.goo.gl/EGqD5C6u62HVXRGm6?g_st=al"},
 {name:"がもううどん",address:"〒762-0023 香川県坂出市加茂町420-1",url:"https://maps.app.goo.gl/Jpt4AMtmZwTATdQeA?g_st=al"},
 {name:"さぬきうどん 上原屋本店",address:"〒760-0073 香川県高松市栗林町1丁目18-8",url:"https://maps.app.goo.gl/RzU4gSLUidjjibeF6?g_st=al"},
 {name:"長田 in 香の香",address:"〒765-0031 香川県善通寺市金蔵寺町1180",url:"https://maps.app.goo.gl/dBS4H7GHFFt2WT5x5?g_st=al"},
 {name:"讃岐麺処山岡",address:"〒768-0023 香川県観音寺市古川町273-1",url:"https://maps.app.goo.gl/M8QbWkDaCSCG5JKd7?g_st=al"},
 {name:"日の出製麺所",address:"〒762-0046 香川県坂出市富士見町1丁目8-5",url:"https://maps.app.goo.gl/1E9MZiXfyYaJ1Lx66?g_st=al"},
 {name:"須崎食料品店",address:"〒767-0014 香川県三豊市高瀬町上麻3778",url:"https://maps.app.goo.gl/JVFty5W7Pa7YN27g9?g_st=al"},
 {name:"おうどん 瀬戸晴れ",address:"〒761-0121 香川県高松市牟礼町牟礼2694-1",url:"https://maps.app.goo.gl/pVunyNSEaMAyfhwi6?g_st=al"},
 {name:"手打ちうどん かじまや",address:"〒768-0001 香川県観音寺市室本町1145-13",url:"https://maps.app.goo.gl/SBwgS9UPrRUnwRkg6?g_st=al"},
 {name:"讃岐ラーメン はまんど",address:"〒767-0031 香川県三野町大見3873-1",url:"https://maps.app.goo.gl/8i5uS1e2AMuNjnXLA?g_st=al"},
 {name:"讃岐らぁ麺 伊吹いりこセンター 根っCO LABO",address:"〒764-0033 香川県仲多度郡多度津町青木565-2",url:"https://maps.app.goo.gl/NTfwy7ZGZK2QtXgK7?g_st=al"}
];

const map = L.map('map', {zoomControl:true});
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom:19,
  attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>'
}).addTo(map);

const list = document.getElementById('list');
const status = document.getElementById('status');
const bounds = L.latLngBounds([]);
let done = 0;

function cacheKey(addr){ return 'kagawa-map-geocode-v1:'+addr; }

async function geocode(address){
  const cached = localStorage.getItem(cacheKey(address));
  if(cached) return JSON.parse(cached);
  const url = 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=jp&q='+encodeURIComponent(address);
  const res = await fetch(url, {headers:{'Accept':'application/json'}});
  if(!res.ok) throw new Error('geocode '+res.status);
  const data = await res.json();
  if(!data.length) return null;
  const p = {lat:Number(data[0].lat), lon:Number(data[0].lon)};
  localStorage.setItem(cacheKey(address), JSON.stringify(p));
  return p;
}

function addListItem(place, i, coord){
  const row=document.createElement('div'); row.className='row';
  row.innerHTML = `<div class="num">${i+1}</div><div style="min-width:0;flex:1"><div class="name">${place.name}</div><div class="addr">${place.address}</div></div><a class="open" href="${place.url}" target="_blank" rel="noopener">Google Maps</a>`;
  list.appendChild(row);
}

async function main(){
  map.setView([34.2,134.0], 10);
  for(let i=0;i<places.length;i++){
    const p=places[i];
    status.textContent=`${i+1}/${places.length} 地点を確認中…`;
    try{
      const c=await geocode(p.address);
      if(c){
        const icon=L.divIcon({className:'',html:`<div class="marker-num">${i+1}</div>`,iconSize:[30,30],iconAnchor:[15,15]});
        const marker=L.marker([c.lat,c.lon],{icon}).addTo(map);
        marker.bindPopup(`<div class="popup-title">${i+1}. ${p.name}</div><div class="popup-addr">${p.address}</div><a class="popup-link" href="${p.url}" target="_blank" rel="noopener">Google Mapsで開く</a>`);
        bounds.extend([c.lat,c.lon]);
        addListItem(p,i,c);
      } else {
        addListItem(p,i,null);
      }
    }catch(e){
      console.warn(p.name,e);
      addListItem(p,i,null);
    }
    done++;
    if(i<places.length-1) await new Promise(r=>setTimeout(r,1100));
  }
  if(bounds.isValid()) map.fitBounds(bounds.pad(0.08));
  status.textContent=`${done}地点を読み込みました。番号をタップしてください。`;
}
main();
</script>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MY MAP</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{display:flex;flex-direction:column;background:#fff;color:#222}
header{height:52px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid #ddd;font-size:18px}
.add{display:flex;gap:8px;padding:10px;border-bottom:1px solid #ddd;background:#fff}
#url{flex:1;min-width:0;height:44px;padding:0 12px;border:1px solid #aaa;border-radius:9px;font-size:15px}
#add{height:44px;border:0;border-radius:9px;background:#111;color:#fff;padding:0 17px;font-size:15px}
#add:disabled{opacity:.55}#map{flex:1;min-height:300px}
.places{max-height:32vh;overflow:auto;border-top:1px solid #ddd;background:#fff}
.head{height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;position:sticky;top:0;background:#fff;border-bottom:1px solid #eee;z-index:2}
#fit{width:40px;height:34px;border:0;border-radius:8px;background:#111;color:#fff;font-size:20px}
.row{display:flex;align-items:center;gap:7px;padding:9px 12px;border-bottom:1px solid #eee}
.name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row button{border:1px solid #ccc;background:#fff;border-radius:7px;padding:7px 10px}.row .del{color:#b00020}
.empty{text-align:center;color:#777;padding:18px}.msg{position:fixed;left:12px;right:12px;top:62px;z-index:2000;padding:11px 12px;border-radius:9px;background:#fff;border:1px solid #ccc;box-shadow:0 3px 14px #0002}
</style>
</head>
<body>
<header><strong>MY MAP</strong></header>
<div class="add"><input id="url" type="url" inputmode="url" autocomplete="off" placeholder="GoogleマップのURLを入力"><button id="add">追加</button></div>
<div id="map"></div>
<div class="places"><div class="head"><b>登録した場所</b><button id="fit">⌖</button></div><div id="list"></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map("map").setView([35.681236,139.767125],5);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"&copy; OpenStreetMap contributors"}).addTo(map);
let places=[];try{places=JSON.parse(localStorage.getItem("MY-MAP-PLACES")||"[]")}catch(e){places=[]}
const markers=new Map();

function safe(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function msg(t){const o=document.querySelector(".msg");if(o)o.remove();const d=document.createElement("div");d.className="msg";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),5500)}
function save(){localStorage.setItem("MY-MAP-PLACES",JSON.stringify(places))}
function coords(s){
 s=String(s||"");
 let m=s.match(/@(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/);if(m)return[+m[1],+m[2]];
 m=s.match(/!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/);if(m)return[+m[1],+m[2]];
 m=s.match(/(?:query|q|center)=(-?\d+(?:\.\d+)?)[,%2C]+(-?\d+(?:\.\d+)?)/i);if(m)return[+m[1],+m[2]];
 return null;
}
function direct(raw){
 let u;try{u=new URL(raw)}catch(e){return null}
 const h=u.hostname.toLowerCase();if(!h.includes("google."))return null;
 const c=coords(u.href);let q=u.searchParams.get("query")||u.searchParams.get("q")||"";
 if(c)return{lat:c[0],lng:c[1],name:q||"登録地点",url:raw};
 const p=u.pathname.match(/\/place\/([^/]+)/);if(!q&&p)q=decodeURIComponent(p[1]).replace(/\+/g," ");
 return{query:q,name:q||"登録地点",url:raw};
}
async function unshorten(raw){
 // Google Maps短縮URL専用の公開アンショートナー。
 // ここで最終URLと緯度経度を取得するため、Google Maps APIキーは不要。
 const api="https://mapu.retiolus.net/unshortener?link="+encodeURIComponent(raw);
 const r=await fetch(api,{cache:"no-store"});
 if(!r.ok)throw Error("unshortener");
 const j=await r.json();
 if(j.lat!=null&&j.long!=null)return{lat:+j.lat,lng:+j.long,name:"登録地点",url:raw};
 if(j.full_link){
   const d=direct(j.full_link);if(d){d.url=raw;return d}
   const c=coords(j.full_link);if(c)return{lat:c[0],lng:c[1],name:"登録地点",url:raw};
 }
 throw Error("no-coords");
}
async function jina(raw){
 const u="https://r.jina.ai/"+raw;
 const r=await fetch(u,{cache:"no-store"});if(!r.ok)throw Error("jina");
 const t=await r.text(),c=coords(t);
 if(c)return{lat:c[0],lng:c[1],name:"登録地点",url:raw};
 const m=t.match(/URL Source:\s*(https?:\/\/[^\s]+)/i);
 if(m){const d=direct(m[1]);if(d)return d}
 const a=t.match(/(?:〒?\s*\d{3}-\d{4}\s*)?([^\\n]{2,80}(?:県|府|都|道)[^\\n]{2,120})/);
 if(a)return{query:a[1].trim(),name:a[1].trim(),url:raw};
 throw Error("jina-no-location");
}
async function geo(q){
 const r=await fetch("https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&accept-language=ja&q="+encodeURIComponent(q));
 if(!r.ok)throw Error("geo");const a=await r.json();if(!a.length)return null;
 return{lat:+a[0].lat,lng:+a[0].lon,name:q};
}
function addMarker(p){
 const m=L.marker([p.lat,p.lng]).addTo(map);
 m.bindPopup("<b>"+safe(p.name)+"</b><br><a href='"+safe(p.url)+"' target='_blank' rel='noopener'>Googleマップで開く</a>");
 markers.set(p.id,m);
}
function render(){
 markers.forEach(m=>m.remove());markers.clear();const list=document.getElementById("list");list.innerHTML="";
 if(!places.length){list.innerHTML='<div class="empty">まだ場所が登録されていません</div>';return}
 places.forEach(p=>{
  addMarker(p);const row=document.createElement("div");row.className="row";
  const n=document.createElement("div");n.className="name";n.textContent=p.name;
  const o=document.createElement("button");o.textContent="開く";o.onclick=()=>location.href=p.url;
  const d=document.createElement("button");d.className="del";d.textContent="削除";d.onclick=()=>{places=places.filter(x=>x.id!==p.id);save();render()};
  row.append(n,o,d);list.append(row);
 })
}
async function addPlace(){
 const input=document.getElementById("url"),raw=input.value.trim();if(!raw)return;
 const b=document.getElementById("add");b.disabled=true;b.textContent="取得中…";
 try{
  let p=direct(raw);
  if(!p)throw Error("not-google");
  const host=new URL(raw).hostname.toLowerCase();
  if(host==="maps.app.goo.gl"||host==="goo.gl"){
   try{p=await unshorten(raw)}catch(e){p=await jina(raw)}
  }
  if(p.query){const g=await geo(p.query);if(!g)throw Error("not-found");p={...p,...g}}
  p.id=crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random();
  places.push(p);save();render();map.setView([p.lat,p.lng],17);markers.get(p.id)?.openPopup();input.value="";
 }catch(e){
  if(e.message==="not-google")msg("GoogleマップのURLを入力してください。");
  else msg("このURLから場所を取得できませんでした。通信状態を確認して、もう一度お試しください。");
 }finally{b.disabled=false;b.textContent="追加"}
}
document.getElementById("add").onclick=addPlace;
document.getElementById("url").addEventListener("keydown",e=>{if(e.key==="Enter")addPlace()});
document.getElementById("fit").onclick=()=>{
 if(!places.length)return;
 if(places.length===1)map.setView([places[0].lat,places[0].lng],17);
 else map.fitBounds(L.latLngBounds(places.map(p=>[p.lat,p.lng])),{padding:[30,30]});
};
render();
</script>
</body>
</html>

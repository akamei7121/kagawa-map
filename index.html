<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MY MAP</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{display:flex;flex-direction:column;color:#222}header{height:52px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid #ddd}
.add{display:flex;gap:8px;padding:10px;border-bottom:1px solid #ddd}.add input{flex:1;min-width:0;height:44px;padding:0 12px;border:1px solid #aaa;border-radius:9px;font-size:15px}
.add button{height:44px;border:0;border-radius:9px;background:#111;color:#fff;padding:0 17px;font-size:15px}.add button:disabled{opacity:.55}
#map{flex:1;min-height:300px}.places{max-height:32vh;overflow:auto;border-top:1px solid #ddd}.head{height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;position:sticky;top:0;background:#fff;z-index:2}
#fit{width:40px;height:34px;border:0;border-radius:8px;background:#111;color:#fff;font-size:20px}.row{display:flex;align-items:center;gap:7px;padding:9px 12px;border-bottom:1px solid #eee}
.name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row button{border:1px solid #ccc;background:#fff;border-radius:7px;padding:7px 10px}.del{color:#b00020}.empty{text-align:center;color:#777;padding:18px}
.msg{position:fixed;left:12px;right:12px;top:62px;z-index:2000;padding:11px 12px;border-radius:9px;background:#fff;border:1px solid #ccc;box-shadow:0 3px 14px #0002}
</style>
</head>
<body>
<header><strong>MY MAP</strong></header>
<div class="add"><input id="url" type="url" placeholder="GoogleマップのURLを入力"><button id="add">追加</button></div>
<div id="map"></div>
<div class="places"><div class="head"><b>登録した場所</b><button id="fit">⌖</button></div><div id="list"></div></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map("map").setView([35.681236,139.767125],5);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"&copy; OpenStreetMap contributors"}).addTo(map);

let places=[];try{places=JSON.parse(localStorage.getItem("MY-MAP-PLACES")||"[]")}catch(e){}
const markers=new Map();

function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function save(){localStorage.setItem("MY-MAP-PLACES",JSON.stringify(places))}
function show(t){const x=document.querySelector(".msg");if(x)x.remove();const d=document.createElement("div");d.className="msg";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),6000)}
function coords(s){
 let m=String(s||"").match(/@(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/);if(m)return[+m[1],+m[2]];
 m=String(s||"").match(/!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/);if(m)return[+m[1],+m[2]];
 m=String(s||"").match(/(?:query|q|center)=(-?\d+(?:\.\d+)?)[,%2C]+(-?\d+(?:\.\d+)?)/i);if(m)return[+m[1],+m[2]];
 return null;
}
function normal(raw){
 let u;try{u=new URL(raw)}catch{return null}
 if(!u.hostname.toLowerCase().includes("google."))return null;
 const c=coords(u.href),q=u.searchParams.get("query")||u.searchParams.get("q")||"";
 if(c)return{lat:c[0],lng:c[1],name:q||"登録地点",url:raw};
 const p=u.pathname.match(/\/place\/([^/]+)/);return{query:q||(p?decodeURIComponent(p[1]).replace(/\+/g," "):""),name:q||"登録地点",url:raw};
}
async function shortByMapu(raw){
 const endpoint="https://mapu.retiolus.net/unshortener?link="+encodeURIComponent(raw);
 const r=await fetch(endpoint,{cache:"no-store",mode:"cors"});if(!r.ok)throw Error("mapu");
 const j=await r.json();
 if(j.lat!==undefined&&j.long!==undefined)return{lat:+j.lat,lng:+j.long,name:j.full_link||"登録地点",url:raw};
 if(j.full_link){const n=normal(j.full_link);if(n)return n}
 throw Error("mapu-data");
}
async function shortByAllOrigins(raw){
 const endpoint="https://api.allorigins.win/get?url="+encodeURIComponent(raw);
 const r=await fetch(endpoint,{cache:"no-store"});if(!r.ok)throw Error("origin");
 const j=await r.json(),text=(j.contents||"");
 const c=coords(j.url)||coords(text);if(c)return{lat:c[0],lng:c[1],name:"登録地点",url:raw};
 const m=text.match(/https?:\/\/www\.google\.[^"' ]+\/maps\/[^"' ]+/);
 if(m){const n=normal(m[0]);if(n)return n}
 throw Error("origin-data");
}
async function geocode(q){
 const r=await fetch("https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&accept-language=ja&q="+encodeURIComponent(q));
 if(!r.ok)throw Error("geo");const a=await r.json();if(!a.length)return null;
 return{lat:+a[0].lat,lng:+a[0].lon,name:q};
}
function marker(p){
 const m=L.marker([p.lat,p.lng]).addTo(map);
 m.bindPopup("<b>"+esc(p.name)+"</b><br><a href='"+esc(p.url)+"' target='_blank' rel='noopener'>Googleマップで開く</a>");
 markers.set(p.id,m);
}
function render(){
 markers.forEach(m=>m.remove());markers.clear();const l=document.getElementById("list");l.innerHTML="";
 if(!places.length){l.innerHTML='<div class="empty">まだ場所が登録されていません</div>';return}
 places.forEach(p=>{
  marker(p);const r=document.createElement("div");r.className="row";
  const n=document.createElement("div");n.className="name";n.textContent=p.name;
  const o=document.createElement("button");o.textContent="開く";o.onclick=()=>location.href=p.url;
  const d=document.createElement("button");d.className="del";d.textContent="削除";d.onclick=()=>{places=places.filter(x=>x.id!==p.id);save();render()};
  r.append(n,o,d);l.append(r)
 })
}
async function add(){
 const input=document.getElementById("url"),raw=input.value.trim();if(!raw)return;
 const b=document.getElementById("add");b.disabled=true;b.textContent="取得中…";
 try{
  let p=normal(raw);if(!p)throw Error("url");
  const h=new URL(raw).hostname.toLowerCase();
  if(h==="maps.app.goo.gl"||h==="goo.gl"){
    try{p=await shortByMapu(raw)}catch(e){p=await shortByAllOrigins(raw)}
  }
  if(p.query){const g=await geocode(p.query);if(!g)throw Error("notfound");p={...p,...g}}
  p.id=crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random();
  places.push(p);save();render();map.setView([p.lat,p.lng],17);markers.get(p.id)?.openPopup();input.value="";
 }catch(e){
  if(e.message==="url")show("GoogleマップのURLを入力してください。");
  else show("URLから場所を取得できませんでした。もう一度お試しください。");
 }finally{b.disabled=false;b.textContent="追加"}
}
document.getElementById("add").onclick=add;
document.getElementById("url").addEventListener("keydown",e=>{if(e.key==="Enter")add()});
document.getElementById("fit").onclick=()=>{if(!places.length)return;if(places.length===1)map.setView([places[0].lat,places[0].lng],17);else map.fitBounds(L.latLngBounds(places.map(p=>[p.lat,p.lng])),{padding:[30,30]})};
render();
</script>
</body>
</html>
